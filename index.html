<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARSHA MEN | Urban Streetwear</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo-container">
            <svg viewBox="0 0 24 24" width="35" height="35" fill="#ff3b30" style="margin-right: 10px;">
                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
            </svg>
            <span class="brand-name">ARSHA MEN</span>
        </div>
        <ul class="nav-links">
            <li><a href="#drops">New Drops</a></li>
            <li><a href="#streetwear">Streetwear</a></li>
            <li><a href="#kicks">Sneakers</a></li>
        </ul>
        <div class="nav-icons">
            <i class="fas fa-search"></i>
            <i class="fas fa-shopping-cart"></i>
        </div>
    </nav>

    <!-- Photo ab CSS se aayegi -->
    <header class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="glow-text">URBAN REVOLUTION</h1>
            <p>Built for the streets. Styled for the youth.</p>
            <a href="#drops" class="btn">Shop The Drop</a>
        </div>
    </header>

    <section id="drops" class="collections">
        <h2 class="section-title">LATEST DROPS</h2>
        <div class="product-grid">
            <div class="product-card">
                <div class="image-wrapper">
                    <img src="https://images.unsplash.com/photo-1578681994506-b8f463449011?auto=format&fit=crop&q=80&w=800" alt="Oversized Hoodie">
                    <div class="quick-add">COP NOW</div>
                </div>
                <div class="product-info">
                    <h4>Phantom Oversized Hoodie</h4>
                    <span class="price">$85</span>
                </div>
            </div>
            <div class="product-card">
                <div class="image-wrapper">
                    <img src="https://images.unsplash.com/photo-1552374196-1ab2a1c593e8?auto=format&fit=crop&q=80&w=800" alt="Cargo Pants">
                    <div class="quick-add">COP NOW</div>
                </div>
                <div class="product-info">
                    <h4>Tech-Wear Cargo Pants</h4>
                    <span class="price">$110</span>
                </div>
            </div>
        </div>
    </section>
</body>
</html>

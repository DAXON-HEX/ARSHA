<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARSHA | Premium Apparel</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <div class="logo">ARSHA</div>
            <ul>
                <li><a href="#">Collections</a></li>
                <li><a href="#">Our Story</a></li>
                <li><a href="#">Journal</a></li>
            </ul>
        </nav>
        <div class="hero">
            <h1>Timeless Elegance</h1>
            <p>Redefining modern luxury</p>
            <a href="#" class="cta-button">Explore Collection</a>
        </div>
    </header>
    <section class="featured">
        <h2>Latest Arrivals</h2>
        <div class="grid">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=800&q=80" alt="Premium Blazer">
                <h3>The Signature Blazer</h3>
                <p>$250.00</p>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1544923246-77be078b430a?w=800&q=80" alt="Silk Dress">
                <h3>Silk Evening Gown</h3>
                <p>$320.00</p>
            </div>
        </div>
    </section>

</html>
